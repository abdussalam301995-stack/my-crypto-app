<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Adsgram SDK Integration -->
    <script src="https://adsgram.ai"></script>
    
    <!-- Telegram Mini App Web SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0c0d14" />
    <meta name="description" content="MAI Mining Telegram Mini App" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>MAI Mining App</title>

    <!-- Advanced UI/UX Animations -->
    <style>
      /* 1. Neon Glowing Effect for the Main Mining Circle */
      @keyframes neonBreathe {
        0% {
          box-shadow: 0 0 25px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 255, 0, 0.2);
          border-color: rgba(0, 255, 0, 0.6);
        }
        50% {
          box-shadow: 0 0 50px rgba(0, 255, 128, 0.9), inset 0 0 30px rgba(0, 255, 128, 0.5);
          border-color: rgba(0, 255, 128, 1);
        }
        100% {
          box-shadow: 0 0 25px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 255, 0, 0.2);
          border-color: rgba(0, 255, 0, 0.6);
        }
      }

      /* 2. Floating Animation to make elements feel dynamic */
      @keyframes floatMovement {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      /* 3. Pulse and Shimmering Effect for the Watch Ad Button */
      @keyframes pulseButton {
        0% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 25px rgba(0, 255, 102, 0.7); }
        100% { transform: scale(1); filter: brightness(1); }
      }

      /* 4. Smooth Rotation for Coins or Turbines */
      @keyframes slowRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* CSS Utility Classes */
      .animated-mining-container {
        animation: floatMovement 4s infinite ease-in-out;
        transition: all 0.3s ease;
      }

      .animated-glow-circle {
        animation: neonBreathe 3s infinite ease-in-out;
        transition: all 0.2s ease-in-out;
      }

      .animated-glow-circle:active {
        transform: scale(0.95);
        filter: brightness(1.3);
      }

      .rotating-coin {
        animation: slowRotate 10s infinite linear;
      }

      .animated-ad-button {
        animation: pulseButton 2s infinite ease-in-out;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      
      .animated-ad-button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #0c0d14; font-family: sans-serif; overflow-x: hidden;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
